name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file exe
        run: cmd /c build.bat

      - name: Show output
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ShouWang-windows-exe
          path: dist/*.exe

      - name: Prepare release asset (ASCII filename)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | Where-Object { $_.Name -notmatch '^ShouWang-' } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $_.DirectoryName ('ShouWang-' + $env:GITHUB_REF_NAME + '-windows.exe'))
          }
          Get-ChildItem dist\*.exe | ForEach-Object { $_.Name + '  ' + $_.Length }

      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 校园网守护 ${{ github.ref_name }}
          files: dist/ShouWang-*-windows.exe
          generate_release_notes: true
